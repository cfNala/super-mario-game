<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级玛丽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 to-sky-200 min-h-screen flex flex-col items-center justify-center">
    <div class="mb-4 text-center">
        <h1 class="text-4xl font-bold text-white drop-shadow-lg mb-2">🍄 超级玛丽 🍄</h1>
        <div class="text-white text-lg space-x-4">
            <span>分数: <strong id="score">0</strong></span>
            <span>金币: <strong id="coins">0</strong></span>
        </div>
        <p class="text-white text-sm mt-2 opacity-80">← → 移动 | 空格 跳跃</p>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="gameOver" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl">
            <h2 id="gameOverTitle" class="text-4xl font-bold mb-4">游戏结束</h2>
            <p id="gameOverScore" class="text-xl mb-6">分数: 0</p>
            <button onclick="restartGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full text-xl transition-all transform hover:scale-105">
                重新开始
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameOver = false;
        let gameWon = false;
        let score = 0;
        let coins = 0;

        // 玛丽奥
        const mario = {
            x: 50,
            y: 300,
            width: 32,
            height: 40,
            normalHeight: 40,
            bigHeight: 56,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: -12,
            gravity: 0.5,
            grounded: false,
            facing: 1, // 1 = right, -1 = left
            isBig: false, // 是否变大
            hasMushroom: false // 是否已经吃到蘑菇
        };

        // 关卡数据
        const platforms = [
            // 地面
            { x: 0, y: 360, width: 800, height: 40, type: 'ground' },
            // 问号砖块（含蘑菇）
            { x: 150, y: 280, width: 40, height: 20, type: 'question', hasMushroom: true, hit: false },
            { x: 370, y: 220, width: 40, height: 20, type: 'question', hasMushroom: false, hit: false, givesCoin: true },
            // 普通砖块
            { x: 200, y: 280, width: 60, height: 20, type: 'brick' },
            { x: 350, y: 220, width: 40, height: 20, type: 'brick' },
            { x: 500, y: 180, width: 100, height: 20, type: 'brick' },
            { x: 650, y: 280, width: 120, height: 20, type: 'brick' },
            // 管道
            { x: 300, y: 310, width: 50, height: 50, type: 'pipe' },
        ];

        // 金币
        let coinList = [
            { x: 230, y: 250, collected: false },
            { x: 260, y: 250, collected: false },
            { x: 370, y: 190, collected: false },
            { x: 530, y: 150, collected: false },
            { x: 560, y: 150, collected: false },
            { x: 680, y: 250, collected: false },
            { x: 710, y: 250, collected: false },
        ];

        // 敌人（板栗仔）
        let enemies = [
            { x: 250, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
            { x: 450, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
            { x: 600, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
        ];

        // 蘑菇
        let mushrooms = [
            { x: 150, y: 240, width: 32, height: 32, velocityX: 2, active: false, spawned: false }
        ];

        // 旗帜（终点）
        const flag = {
            x: 750,
            y: 260,
            width: 30,
            height: 100
        };

        // 键盘控制
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function update() {
            if (gameOver) return;

            // 更新玛丽奥尺寸
            mario.height = mario.isBig ? mario.bigHeight : mario.normalHeight;

            // 左右移动
            if (keys['ArrowLeft']) {
                mario.velocityX = -mario.speed;
                mario.facing = -1;
            } else if (keys['ArrowRight']) {
                mario.velocityX = mario.speed;
                mario.facing = 1;
            } else {
                mario.velocityX = 0;
            }

            // 跳跃
            if (keys['Space'] && mario.grounded) {
                mario.velocityY = mario.jumpPower;
                mario.grounded = false;
            }

            // 重力
            mario.velocityY += mario.gravity;

            // 更新位置
            mario.x += mario.velocityX;
            mario.y += mario.velocityY;

            // 边界检测
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

            // 掉落检测
            if (mario.y > canvas.height) {
                endGame(false);
            }

            mario.grounded = false;

            // 平台碰撞（包括顶砖块检测）
            platforms.forEach(platform => {
                // 从上方落地
                if (mario.x < platform.x + platform.width &&
                    mario.x + mario.width > platform.x &&
                    mario.y + mario.height > platform.y &&
                    mario.y + mario.height < platform.y + platform.height + 10 &&
                    mario.velocityY >= 0) {
                    mario.y = platform.y - mario.height;
                    mario.velocityY = 0;
                    mario.grounded = true;
                }

                // 从下方顶砖块
                if (platform.type === 'question' && !platform.hit &&
                    mario.x < platform.x + platform.width &&
                    mario.x + mario.width > platform.x &&
                    mario.y < platform.y + platform.height &&
                    mario.y > platform.y - 20 &&
                    mario.velocityY < 0) {
                    platform.hit = true;
                    mario.velocityY = 2; // 反弹

                    // 生成蘑菇或金币
                    if (platform.hasMushroom) {
                        const mushroom = mushrooms.find(m => !m.spawned);
                        if (mushroom) {
                            mushroom.active = true;
                            mushroom.spawned = true;
                            mushroom.x = platform.x;
                            mushroom.y = platform.y - 32;
                        }
                    } else if (platform.givesCoin) {
                        coins++;
                        score += 100;
                        updateUI();
                    }
                }
            });

            // 金币收集
            coinList.forEach(coin => {
                if (!coin.collected &&
                    mario.x < coin.x + 20 &&
                    mario.x + mario.width > coin.x &&
                    mario.y < coin.y + 20 &&
                    mario.y + mario.height > coin.y) {
                    coin.collected = true;
                    coins++;
                    score += 100;
                    updateUI();
                }
            });

            // 敌人更新和碰撞
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                enemy.x += enemy.velocityX;

                // 敌人边界反弹
                if (enemy.x < 0 || enemy.x + enemy.width > canvas.width) {
                    enemy.velocityX *= -1;
                }

                // 与玛丽奥碰撞
                if (mario.x < enemy.x + enemy.width &&
                    mario.x + mario.width > enemy.x &&
                    mario.y < enemy.y + enemy.height &&
                    mario.y + mario.height > enemy.y) {

                    // 从上方踩敌人
                    if (mario.velocityY > 0 && mario.y + mario.height - enemy.y < 20) {
                        enemy.alive = false;
                        mario.velocityY = -8;
                        score += 200;
                        updateUI();
                    } else {
                        // 被敌人碰到
                        if (mario.isBig) {
                            // 如果是大的，变小
                            mario.isBig = false;
                            mario.y += 16; // 调整位置
                            mario.velocityY = -5;
                            // 短暂无敌时间可以后续添加
                        } else {
                            endGame(false);
                        }
                    }
                }
            });

            // 蘑菇更新和碰撞
            mushrooms.forEach(mushroom => {
                if (!mushroom.active) return;

                // 蘑菇移动
                mushroom.x += mushroom.velocityX;

                // 蘑菇重力
                mushroom.y += 3;
                mushroom.y = Math.min(mushroom.y, 328);

                // 蘑菇边界反弹
                if (mushroom.x < 0 || mushroom.x + mushroom.width > canvas.width) {
                    mushroom.velocityX *= -1;
                }

                // 与玛丽奥碰撞
                if (mario.x < mushroom.x + mushroom.width &&
                    mario.x + mario.width > mushroom.x &&
                    mario.y < mushroom.y + mushroom.height &&
                    mario.y + mario.height > mushroom.y) {
                    if (!mario.hasMushroom) {
                        mario.isBig = true;
                        mario.hasMushroom = true;
                        mario.y -= 16; // 向上调整位置
                        mushroom.active = false;
                        score += 1000;
                        updateUI();
                    }
                }
            });

            // 到达终点
            if (mario.x + mario.width > flag.x) {
                endGame(true);
            }
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画云朵
            ctx.fillStyle = 'white';
            drawCloud(100, 60, 40);
            drawCloud(350, 40, 50);
            drawCloud(600, 70, 35);

            // 画山丘
            drawHill(50, 360, 150, 80);
            drawHill(600, 360, 200, 100);

            // 画平台
            platforms.forEach(platform => {
                if (platform.type === 'ground') {
                    // 地面
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(platform.x, platform.y, platform.width, 10);
                } else if (platform.type === 'question') {
                    // 问号砖块
                    ctx.fillStyle = platform.hit ? '#8B6914' : '#FFD700';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);

                    // 问号
                    if (!platform.hit) {
                        ctx.fillStyle = '#8B4513';
                        ctx.font = 'bold 16px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('?', platform.x + platform.width / 2, platform.y + 15);
                    }
                } else if (platform.type === 'brick') {
                    // 砖块
                    ctx.fillStyle = '#CD853F';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
                } else if (platform.type === 'pipe') {
                    // 管道
                    ctx.fillStyle = '#32CD32';
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(platform.x + 5, platform.y, platform.width - 10, platform.height);
                }
            });

            // 画金币
            coinList.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x + 10, coin.y + 10, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.arc(coin.x + 10, coin.y + 10, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 画敌人
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    // 身体
                    ctx.fillStyle = '#8B4513';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x + 15, enemy.y + 15, 15, 12, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 眼睛
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(enemy.x + 10, enemy.y + 10, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(enemy.x + 20, enemy.y + 10, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(enemy.x + 10, enemy.y + 10, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(enemy.x + 20, enemy.y + 10, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 画蘑菇
            mushrooms.forEach(mushroom => {
                if (mushroom.active) {
                    // 蘑菇头
                    ctx.fillStyle = '#FF4500';
                    ctx.beginPath();
                    ctx.ellipse(mushroom.x + 16, mushroom.y + 10, 16, 14, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 蘑菇斑点
                    ctx.fillStyle = '#FFFF00';
                    ctx.beginPath();
                    ctx.arc(mushroom.x + 10, mushroom.y + 8, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(mushroom.x + 22, mushroom.y + 8, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(mushroom.x + 16, mushroom.y + 14, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // 蘑菇柄
                    ctx.fillStyle = '#FFFAF0';
                    ctx.fillRect(mushroom.x + 10, mushroom.y + 18, 12, 14);
                }
            });

            // 画旗帜
            ctx.fillStyle = '#228B22';
            ctx.fillRect(flag.x, flag.y, 5, flag.height);
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.moveTo(flag.x + 5, flag.y);
            ctx.lineTo(flag.x + 35, flag.y + 20);
            ctx.lineTo(flag.x + 5, flag.y + 40);
            ctx.fill();

            // 画玛丽奥
            const scale = mario.isBig ? 1.4 : 1;
            const帽子宽度 = Math.floor(24 * scale);
            const帽子高度 = Math.floor(10 * scale);
            const脸部宽度 = Math.floor(20 * scale);
            const脸部高度 = Math.floor(12 * scale);
            const身体宽度 = Math.floor(20 * scale);
            const身体高度 = Math.floor(12 * scale);
            const裤子宽度 = Math.floor(24 * scale);
            const裤子高度 = Math.floor(12 * scale);

            // 帽子
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(mario.x + 4, mario.y, 帽子宽度, 帽子高度);

            // 脸
            ctx.fillStyle = '#FFDAB9';
            ctx.fillRect(mario.x + 6, mario.y + 帽子高度, 脸部宽度, 脸部高度);

            // 眼睛和胡子
            ctx.fillStyle = 'black';
            if (mario.facing === 1) {
                ctx.fillRect(mario.x + 帽子宽度 + 1, mario.y + 帽子高度 + 4, 3, 3);
                ctx.fillRect(mario.x + 帽子宽度 - 1, mario.y + 帽子高度 + 8, 6, 2);
            } else {
                ctx.fillRect(mario.x + 9, mario.y + 帽子高度 + 4, 3, 3);
                ctx.fillRect(mario.x + 8, mario.y + 帽子高度 + 8, 6, 2);
            }

            // 身体
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(mario.x + 6, mario.y + 帽子高度 + 脸部高度, 身体宽度, 身体高度);

            // 背带裤
            ctx.fillStyle = '#0000CD';
            ctx.fillRect(mario.x + 4, mario.y + 帽子高度 + 脸部高度 + 身体高度 - 2, 裤子宽度, 裤子高度);
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.4, y - size * 0.1, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y, size * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHill(x, y, width, height) {
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + width / 2, y - height, x + width, y);
            ctx.fill();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('coins').textContent = coins;
        }

        function endGame(won) {
            gameOver = true;
            gameWon = won;
            const gameOverDiv = document.getElementById('gameOver');
            const title = document.getElementById('gameOverTitle');
            const scoreText = document.getElementById('gameOverScore');

            title.textContent = won ? '🎉 恭喜通关！🎉' : '💀 游戏结束 💀';
            title.className = won ? 'text-4xl font-bold mb-4 text-green-500' : 'text-4xl font-bold mb-4 text-red-500';
            scoreText.textContent = `最终分数: ${score}`;
            gameOverDiv.classList.remove('hidden');
        }

        function restartGame() {
            gameOver = false;
            gameWon = false;
            score = 0;
            coins = 0;

            mario.x = 50;
            mario.y = 300;
            mario.velocityX = 0;
            mario.velocityY = 0;
            mario.isBig = false;
            mario.hasMushroom = false;

            // 重置问号砖块
            platforms.forEach(platform => {
                if (platform.type === 'question') {
                    platform.hit = false;
                }
            });

            // 重置蘑菇
            mushrooms.forEach(mushroom => {
                mushroom.active = false;
                mushroom.spawned = false;
            });

            coinList.forEach(coin => coin.collected = false);
            enemies = [
                { x: 250, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
                { x: 450, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
                { x: 600, y: 335, width: 30, height: 25, velocityX: -1.5, alive: true },
            ];

            document.getElementById('gameOver').classList.add('hidden');
            updateUI();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 启动游戏
        gameLoop();
    </script>
</body>
</html>
